services:
  - type: web
    name: askloom-backend
    env: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: askloom-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_REDIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEBHOOK_WORKER_ENABLED
        value: true
      - key: WEBHOOK_RETRY_INTERVAL_MS
        value: 60000
  - type: web
    name: askloom-frontend
    env: docker
    rootDir: frontend
    plan: starter
    envVars:
      - key: VITE_API_BASE
        sync: false

databases:
  - name: askloom-postgres
    plan: starter
